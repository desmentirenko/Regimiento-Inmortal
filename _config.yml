# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Expediente FIMI
first_name: Sistema
middle_name: ""
last_name: Argos
# Eliminamos la nota de contacto genérica para mantener el tono profesional
contact_note: >
  Repositorio de evidencias desclasificadas sobre operaciones de interferencia extranjera.
description: > 
  Base de datos abierta con evidencias verificables OSINT sobre la red de influencia rusa en España y la instrumentalización del Regimiento Inmortal.

footer_text: >
  Investigación de fuentes abiertas (OSINT). 
  Documentación de libre acceso para prensa y autoridades.
keywords: OSINT, FIMI, Regimiento Inmortal, desinformación, España, inteligencia
lang: es # CAMBIADO a 'es' para que los buscadores indexen correctamente el contenido en español
icon: 🔍 # Cambiado a una lupa acorde al tema de investigación

url: "https://desmentirenko.github.io"
baseurl: "/Regimiento-Inmortal" 
last_updated: true # Activado para mostrar cuándo se actualizó el expediente por última vez
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# Recomendado: default para claro, dark para oscuro (estilo terminal)
repo_theme_light: default 
repo_theme_dark: dark 

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
search_enabled: true # Vital para que encuentren evidencias por palabras clave

# -----------------------------------------------------------------------------
# Blog (Ajustado para que no parezca un blog académico genérico)
# -----------------------------------------------------------------------------

blog_name: Informes de Campo
blog_description: Actualizaciones y nuevas evidencias interceptadas.
permalink: /evidencias/:year/:title/ # Cambiado 'blog' por 'evidencias'

# -----------------------------------------------------------------------------
# Collections (Renombramos para que encaje con el proyecto)
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
  projects: # Aquí irán los informes principales
    output: true
    permalink: /informes/:path/
  publications: # Aquí irán los dossiers PDF
    output: true

# -----------------------------------------------------------------------------
# Jekyll Scholar (IMPORTANTE: Cambiar el nombre del autor por defecto)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Argos] # Cambiado de Einstein a Argos
  first_name: [Sistema]

  style: apa
  locale: es # Cambiado a español

  source: /_bibliography/
  bibliography: papers.bib

# -----------------------------------------------------------------------------
# Responsive WebP Images (Activado para optimizar carga)
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true 
  widths: [480, 800, 1400]
  input_directories: ["assets/img/"]
  output_formats:
    webp: "-auto-orient -quality 85"

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false
enable_darkmode: true # El modo oscuro le da un aspecto de "terminal de inteligencia"
enable_project_categories: true 
enable_progressbar: true

# Error Fix: Mandatory block for al-folio
third_party_libraries:
  jquery:
    version: "3.6.0"
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@{{version}}/dist/jquery.min.js"
  bootstrap-table:
    version: "1.22.4"
    url:
      js: "https://cdn.jsdelivr.net/npm/bootstrap-table@{{version}}/dist/bootstrap-table.min.js"
